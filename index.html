<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>ExamSathi Odisha | AI Mock Test</title>

<meta name="description"
content="ExamSathi Odisha - Government Exam Preparation with Gemini AI Mock Tests">

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f7fb;
  color:#172033;
}

header{
  background:linear-gradient(135deg,#ff9933,#ffffff,#138808);
  padding:25px 15px;
  text-align:center;
  border-bottom:1px solid #ddd;
}

header h1{
  margin:0;
  font-size:30px;
}

header p{
  margin:8px 0 0;
  font-weight:bold;
}

.container{
  width:min(1000px,94%);
  margin:25px auto;
}

.card{
  background:white;
  padding:22px;
  border-radius:16px;
  margin-bottom:20px;
  box-shadow:0 4px 18px rgba(0,0,0,.08);
}

h2{
  margin-top:0;
}

label{
  display:block;
  font-weight:bold;
  margin:14px 0 6px;
}

select,
input{
  width:100%;
  padding:13px;
  border:1px solid #ccd3df;
  border-radius:10px;
  font-size:16px;
}

button{
  border:0;
  border-radius:10px;
  padding:13px 18px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.generate{
  background:#6f42c1;
  color:white;
  width:100%;
  margin-top:20px;
}

.generate:hover{
  opacity:.9;
}

.option{
  display:block;
  width:100%;
  text-align:left;
  background:#f5f7fa;
  margin:10px 0;
  border:1px solid #d8dee8;
}

.option:hover{
  background:#e9eef7;
}

.option.correct{
  background:#d9f7df;
  border-color:#198754;
}

.option.wrong{
  background:#ffdede;
  border-color:#dc3545;
}

.next{
  background:#198754;
  color:white;
  width:100%;
  margin-top:15px;
}

.hidden{
  display:none;
}

.status{
  padding:14px;
  border-radius:10px;
  background:#eef3ff;
  margin-top:15px;
}

.error{
  background:#ffe4e4;
  color:#a40000;
}

.success{
  background:#ddf8e5;
  color:#08752b;
}

.small{
  color:#687386;
  font-size:14px;
}

.score{
  text-align:center;
  font-size:24px;
  font-weight:bold;
}

footer{
  text-align:center;
  padding:30px;
  color:#687386;
}
</style>
</head>

<body>

<header>
  <h1>🇮🇳 ExamSathi Odisha</h1>
  <p>Government Exam Preparation • AI Mock Test</p>
</header>

<div class="container">

  <div class="card">

    <h2>🤖 Gemini AI Mock Test</h2>

    <p class="small">
      Generate practice questions using Gemini AI.
    </p>

    <label for="exam">
      Exam
    </label>

    <select id="exam">
      <option value="OSSC">OSSC</option>
      <option value="OSSSC">OSSSC</option>
      <option value="OPSC">OPSC</option>
      <option value="Odisha Police">Odisha Police</option>
      <option value="CT Entrance">CT Entrance</option>
      <option value="Other Odisha Government Exam">
        Other Odisha Government Exam
      </option>
    </select>

    <label for="subject">
      Subject
    </label>

    <select id="subject">
      <option value="General Knowledge">
        General Knowledge
      </option>

      <option value="Odisha General Knowledge">
        Odisha General Knowledge
      </option>

      <option value="Current Affairs">
        Current Affairs
      </option>

      <option value="English">
        English
      </option>

      <option value="Mathematics">
        Mathematics
      </option>

      <option value="Reasoning">
        Reasoning
      </option>

      <option value="Science">
        Science
      </option>
    </select>

    <label for="topic">
      Topic
    </label>

    <input
      id="topic"
      value="Odisha"
      placeholder="Example: Odisha History"
    >

    <label for="difficulty">
      Difficulty
    </label>

    <select id="difficulty">

      <option value="easy">
        Easy
      </option>

      <option value="medium" selected>
        Medium
      </option>

      <option value="hard">
        Hard
      </option>

    </select>

    <label for="count">
      Number of Questions
    </label>

    <select id="count">

      <option value="5">
        5 Questions
      </option>

      <option value="10" selected>
        10 Questions
      </option>

      <option value="20">
        20 Questions
      </option>

    </select>

    <button
      class="generate"
      onclick="generateQuestions()">

      🤖 Generate AI Mock Test

    </button>

    <div
      id="status"
      class="status hidden">
    </div>

  </div>


  <div
    id="testCard"
    class="card hidden">

    <div id="progress"
         class="small">
    </div>

    <h2 id="question">
      Question
    </h2>

    <div id="options">
    </div>

    <div
      id="explanation"
      class="status hidden">
    </div>

    <button
      id="next"
      class="next hidden"
      onclick="nextQuestion()">

      Next Question →

    </button>

  </div>


  <div
    id="resultCard"
    class="card hidden">

    <div class="score"
         id="score">
    </div>

    <button
      class="generate"
      onclick="resetTest()">

      🔄 Start New Test

    </button>

  </div>

</div>


<footer>
  © 2026 ExamSathi Odisha
</footer>


<script>

/* =====================================================
   SUPABASE CONFIG
   ===================================================== */

const SUPABASE_URL =
  "https://ullqxaoctpedgtxlaesh.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_NW1cUIuZ4pqFxJ_iuNBbcg_pS-PjUqr";


/* =====================================================
   EDGE FUNCTION
   ===================================================== */

const SMART_ENDPOINT =
  SUPABASE_URL +
  "/functions/v1/smart-endpoint";


/* =====================================================
   TEST VARIABLES
   ===================================================== */

let questions = [];

let currentIndex = 0;

let score = 0;

let answered = false;


/* =====================================================
   GENERATE QUESTIONS
   ===================================================== */

async function generateQuestions(){

  const exam =
    document.getElementById("exam").value;

  const subject =
    document.getElementById("subject").value;

  const topic =
    document.getElementById("topic").value.trim()
    || "General";

  const difficulty =
    document.getElementById("difficulty").value;

  const count =
    Number(
      document.getElementById("count").value
    );


  const status =
    document.getElementById("status");

  status.className =
    "status";

  status.textContent =
    "🤖 Gemini is generating questions... Please wait.";

  status.classList.remove("hidden");


  try{

    const response =
      await fetch(
        SMART_ENDPOINT,
        {
          method:"POST",

          headers:{
            "apikey":SUPABASE_KEY,

            "Content-Type":
              "application/json",

            "Accept":
              "application/json"
          },

          body:JSON.stringify({

            exam_id:
              exam,

            exam_name:
              exam,

            category:
              "Odisha Government Exams",

            subject:
              subject,

            topic:
              topic,

            difficulty:
              difficulty,

            question_type:
              "practice",

            pyq_year:
              null,

            count:
              count,

            language:
              "Odia + English"

          })
        }
      );


    const data =
      await response.json();


    console.log(
      "AI Response:",
      data
    );


    if(!response.ok){

      throw new Error(
        data?.details ||
        data?.error ||
        "AI service error"
      );

    }


    if(
      data.success !== true ||
      !Array.isArray(data.questions) ||
      data.questions.length === 0
    ){

      throw new Error(
        "No questions received from AI."
      );

    }


    questions =
      data.questions;


    currentIndex =
      0;

    score =
      0;

    answered =
      false;


    status.className =
      "status success";

    status.textContent =
      "✅ " +
      questions.length +
      " questions generated successfully!";


    document
      .getElementById("testCard")
      .classList.remove("hidden");


    document
      .getElementById("resultCard")
      .classList.add("hidden");


    setTimeout(
      function(){

        showQuestion();

      },
      700
    );


  }catch(error){

    console.error(
      "AI ERROR:",
      error
    );


    status.className =
      "status error";

    status.textContent =
      "❌ " +
      (
        error.message ||
        "AI service error"
      );

  }

}


/* =====================================================
   SHOW QUESTION
   ===================================================== */

function showQuestion(){

  if(
    currentIndex >=
    questions.length
  ){

    showResult();

    return;

  }


  answered =
    false;


  const q =
    questions[currentIndex];


  document.getElementById(
    "progress"
  ).textContent =
    "Question " +
    (currentIndex + 1) +
    " of " +
    questions.length;


  document.getElementById(
    "question"
  ).textContent =
    q.question;


  const options =
    document.getElementById(
      "options"
    );


  options.innerHTML =
    "";


  const optionData = [

    ["A",q.option_a],

    ["B",q.option_b],

    ["C",q.option_c],

    ["D",q.option_d]

  ];


  optionData.forEach(
    function(item){

      const button =
        document.createElement(
          "button"
        );


      button.className =
        "option";


      button.textContent =
        item[0] +
        ". " +
        item[1];


      button.onclick =
        function(){

          selectAnswer(
            item[0],
            button
          );

        };


      options.appendChild(
        button
      );

    }
  );


  document.getElementById(
    "explanation"
  ).classList.add(
    "hidden"
  );


  document.getElementById(
    "explanation"
  ).textContent =
    "";


  document.getElementById(
    "next"
  ).classList.add(
    "hidden"
  );

}


/* =====================================================
   SELECT ANSWER
   ===================================================== */

function selectAnswer(
  selected,
  clickedButton
){

  if(answered)
    return;


  answered =
    true;


  const q =
    questions[currentIndex];


  const correct =
    String(
      q.correct_ans
    )
    .trim()
    .toUpperCase();


  const allButtons =
    document.querySelectorAll(
      "#options .option"
    );


  allButtons.forEach(
    function(button){

      const letter =
        button.textContent
          .trim()
          .charAt(0)
          .toUpperCase();


      if(letter === correct){

        button.classList.add(
          "correct"
        );

      }

    }
  );


  if(
    selected === correct
  ){

    score++;

    clickedButton.classList.add(
      "correct"
    );

  }else{

    clickedButton.classList.add(
      "wrong"
    );

  }


  const explanation =
    document.getElementById(
      "explanation"
    );


  explanation.textContent =
    "💡 Explanation: " +
    (
      q.explanation ||
      "Explanation not available."
    );


  explanation.classList.remove(
    "hidden"
  );


  document.getElementById(
    "next"
  ).classList.remove(
    "hidden"
  );

}


/* =====================================================
   NEXT QUESTION
   ===================================================== */

function nextQuestion(){

  currentIndex++;

  showQuestion();

}


/* =====================================================
   RESULT
   ===================================================== */

function showResult(){

  document.getElementById(
    "testCard"
  ).classList.add(
    "hidden"
  );


  document.getElementById(
    "resultCard"
  ).classList.remove(
    "hidden"
  );


  const percentage =
    Math.round(
      (
        score /
        questions.length
      ) * 100
    );


  document.getElementById(
    "score"
  ).innerHTML =
    `
      🎉 Test Completed!<br><br>

      Score:
      ${score}
      /
      ${questions.length}

      <br><br>

      ${percentage}%

      <br><br>

      ${
        percentage >= 80
          ? "Excellent! 🌟"
          : percentage >= 50
          ? "Good Job! 👍"
          : "Keep Practicing! 💪"
      }
    `;

}


/* =====================================================
   RESET
   ===================================================== */

function resetTest(){

  questions = [];

  currentIndex = 0;

  score = 0;

  answered = false;


  document.getElementById(
    "resultCard"
  ).classList.add(
    "hidden"
  );


  document.getElementById(
    "testCard"
  ).classList.add(
    "hidden"
  );


  document.getElementById(
    "status"
  ).classList.add(
    "hidden"
  );


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}

</script>

</body>
</html>
